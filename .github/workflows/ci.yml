name: CI

on:
  push:
    branches: [development, master]
  pull_request:
    branches: [development, master]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - run: yarn prod:build
      # Lint is excluded until Flow is retired (A-15) or a Flow-aware parser is configured;
      # eslint currently fails on every file with Flow annotations (87 errors on untouched code).
      # Tests are excluded until the Jest suite is rewritten to cover the live leo product;
      # the existing tests cover only the dormant blog and may not pass.
